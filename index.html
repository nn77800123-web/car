function exportOwnerStmtCsv() {
  const myCars = D.cars.filter(c => (CURRENT_USER.carIds || []).includes(c.id));
  const curCar = OC === "all" ? null : myCars.find(c => c.id === OC);
  const activeCars = curCar ? [curCar] : myCars;
  const activeCarIds = activeCars.map(c => c.id);

  let csv = "كشف حساب مالك سيارات - RentDrive\n";
  csv += `المالك,${CURRENT_USER.name}\n`;
  csv += `الفترة,${RP === "m" ? RM : RP === "y" ? RY : "الكل"}\n\n`;

  csv += "ملخص الحساب\n";
  const carStmts = activeCars.map(stmt);
  const totalRev = r2(carStmts.reduce((s, x) => s + x.R, 0));
  const totalExp = r2(carStmts.reduce((s, x) => s + x.E, 0));
  const totalNet = r2(carStmts.reduce((s, x) => s + x.net, 0));
  const totalMg = r2(carStmts.reduce((s, x) => s + x.mg, 0));
  const totalOwn = r2(carStmts.reduce((s, x) => s + x.own, 0));

  csv += `إجمالي الإيرادات,${totalRev}\n`;
  csv += `إجمالي المصاريف,${totalExp}\n`;
  csv += `الصافي بعد المصاريف,${totalNet}\n`;
  csv += `نسبة الإدارة,${totalMg}\n`;
  csv += `صافي المستحق للمالك,${totalOwn}\n\n`;

  csv += "تفاصيل الإيرادات\n";
  csv += "التاريخ,السيارة,اللوحة,الفترة,المبلغ\n";
  D.bookings.filter(b => activeCarIds.includes(b.car)).forEach(b => {
    const c = byId("cars", b.car);
    pays(b).filter(p => inPer(p.d)).forEach(p => {
      csv += `"${p.d}","${c?.name || ""}","${c?.plate || ""}","${b.from} - ${b.to}",${p.a || 0}\n`;
    });
  });

  csv += "\nتفاصيل المصاريف\n";
  csv += "التاريخ,السيارة,البند,المبلغ,الملاحظة\n";
  D.txns.filter(t => t.type === "out" && activeCarIds.includes(t.car) && inPer(t.date)).forEach(t => {
    const c = byId("cars", t.car);
    csv += `"${t.date}","${c?.name || ""}","${t.cat || ""}",${t.amt || 0},"${t.note || ""}"\n`;
  });

  const filename = `owner_stmt_${CURRENT_USER.username}_${today()}.csv`;
  if (DL && DL.save) {
    DL.save({ filename, data: "\uFEFF" + csv });
  } else if (window.AndroidBridge && window.AndroidBridge.exportCsv) {
    window.AndroidBridge.exportCsv(filename, "\uFEFF" + csv);
  }
}

/* Modal Form Utilities */
function open(title, body, onSave, delFn) {
  $("#md").innerHTML = `<div class="modal"><div class="sheet"><b>${title}</b>${body}<button class="btn" id="sv">حفظ</button>${delFn ? '<button class="btn d" id="dl">حذف</button>' : ""}<button class="btn s" id="cx">إلغاء</button></div></div>`;
  const close = () => $("#md").innerHTML = "";
  $("#cx").onclick = close;
  $("#sv").onclick = () => { if (onSave() !== false) close(); };
  if (delFn) $("#dl").onclick = () => { delFn(); close(); };
}

const v = id => $("#" + id).value.trim();
const inp = (id, l, val = "", t = "text") => `<label>${l}</label><input id="${id}" type="${t}" value="${esc(val)}" ${t === "number" ? 'inputmode="decimal"' : ""}>`;
const sel = (id, l, opts, val) => `<label>${l}</label><select id="${id}">${opts.map(([k, n]) => `<option value="${esc(k)}" ${k === val ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>`;

function fCar(id) {
  const c = typeof id === "string" ? byId("cars", id) : {};
  const currentOwner = c.owner || byId("terms", c.id)?.owner || "";
  const ownerOpts = [
    ["", "— سيارة ملك للمكتب (بدون مالك خارجي) —"],
    ...D.owners.map(o => [o.id, `${o.name} (${o.phone || ""})`])
  ];

  open(c.id ? "تعديل عربية" : "عربية جديدة",
    inp("a", "الاسم / الموديل", c.name) +
    inp("b", "رقم اللوحة", c.plate) +
    sel("car_owner", "ربط السيارة بالمالك مباشرة", ownerOpts, currentOwner) +
    inp("c", "سعر اليوم (ج.م)", c.price, "number") +
    inp("monthPrice", "سعر الشهر (ج.م) للإيجار الشهري", c.monthPrice || (c.price ? c.price * 26 : ""), "number") +
    inp("d", "تاريخ انتهاء الرخصة", c.exp, "date") +
    inp("g", "تاريخ انتهاء التأمين", c.ins, "date") +
    inp("o", "العداد الحالي (كم)", c.id ? curKm(c) || "" : "", "number") +
    inp("svcInterval", "دورية صيانة السيارة كل كم كيلومتر (مثال: 5000 أو 10000 كم)", c.svcInterval || 5000, "number") +
    inp("n", "الصيانة القادمة عند (كم) — تتجدد تلقائياً عند إجراء الصيانة", c.svc || "", "number") +
    sel("car_st", "حالة السيارة وتشغيلها بالأسطول", [
      ["active", "🟢 نشطة وشغالة بالأسطول"],
      ["returned_to_owner", "📦 تم تسليمها لصاحبها وإنهاء العقد (أرشيف)"]
    ], c.status || "active") +
    phIn(c.photo),
    () => {
      if (!req(["a", "b", "c", "d", "g", "o"])) return false;
      const odoVal = +v("o") || 0;
      const interval = +v("svcInterval") || 5000;
      const svcVal = +v("n") || (odoVal + interval);
      const chosenOwner = v("car_owner");
      const chosenStatus = v("car_st") || "active";

      const o = {
        id: c.id,
        name: v("a"),
        plate: v("b"),
        price: +v("c") || 0,
        monthPrice: +v("monthPrice") || 0,
        exp: v("d"),
        ins: v("g"),
        odo: odoVal,
        svcInterval: interval,
        svc: svcVal,
        owner: chosenOwner,
        status: chosenStatus
      };

      up().then(p => {
        save("cars", { ...o, photo: p || c.photo || "" }).then(savedCar => {
          const carId = c.id || savedCar?.id;
          if (carId && chosenOwner) {
            const exTerms = byId("terms", carId) || {};
            save("terms", {
              id: carId,
              car: carId,
              owner: chosenOwner,
              cS: exTerms.cS || today(),
              cEnd: exTerms.cEnd || "",
              pct: exTerms.pct || 15,
              status: chosenStatus
            });
          }
        });
      });
    }, c.id && (() => del("cars", c.id)));

  setTimeout(() => {
    const odoInp = document.getElementById("o");
    const intervalInp = document.getElementById("svcInterval");
    const nextInp = document.getElementById("n");
    if (odoInp && intervalInp && nextInp && !c.id) {
      const recalc = () => {
        const o = +odoInp.value || 0;
        const iv = +intervalInp.value || 5000;
        if (o > 0) nextInp.value = o + iv;
      };
      odoInp.oninput = recalc;
      intervalInp.oninput = recalc;
    }
  }, 60);
}

function fBook(id) {
  const b = typeof id === "string" ? byId("bookings", id) : {};
  const activeCars = D.cars.filter(c => (c.status !== "returned_to_owner" && c.status !== "archived") || c.id === b.car);
  if (!activeCars.length || !D.customers.length) return alert("أضف عربية نشطة وعميل أولاً لإنشاء حجز");

  open(b.id ? "تعديل حجز / تشغيلة" : "حجز / تشغيلة جديدة",
    sel("a", "العميل", D.customers.map(c => [c.id, c.name + (c.phone ? " - " + c.phone : "")]), b.cust) +
    sel("b", "العربية", activeCars.map(c => [c.id, c.name + " - " + c.plate + (c.price ? ` (${c.price} ج/يوم)` : "")]), b.car) +
    inp("c", "من تاريخ", b.from || today(), "date") +
    inp("d", "إلى تاريخ", b.to || today(), "date") +
    inp("e", "قيمة الإيجار الأساسية (فارغ = حساب تلقائي حسب الأيام/الشهور)", b.total, "number") +
    inp("dailyKm", "عدد الكيلومترات اليومية المتاحة للعميل (كم/يوم)", b.dailyKm ?? 200, "number") +
    inp("extraKmPrice", "سعر الكيلومتر الزائد (ج.م/كم)", b.extraKmPrice ?? 5, "number") +
    inp("k", "عداد الخروج (كم)", b.odoOut || "", "number") +
    inp("m", "عداد الدخول (كم) — يسجل عند عودة السيارة لحساب الكيلومتر الزائد", b.odoIn || "", "number") +
    (b.id ? "" : inp("f", "المدفوع مقدماً", b.paid || "", "number") + recSel("")),
    () => {
      if (!req(["c", "d", "k"].concat(b.id ? [] : ["f"]).concat(b.status === "done" ? ["m"] : []))) return false;
      const f0 = v("c"), t0 = v("d");
      if (!f0 || !t0 || t0 < f0) { alert("تاريخ النهاية يجب أن يكون بعد أو مساوياً لتاريخ البداية"); return false; }
      if (+v("m") && +v("k") && +v("m") < +v("k")) { alert("عداد الدخول يجب أن يكون أكبر من عداد الخروج"); return false; }
      const cf = D.bookings.find(o => o.id !== b.id && o.car === v("b") && o.status !== "done" && o.from <= t0 && f0 <= o.to);
      if (cf) { alert("العربية محجوزة بالفعل في هذه الفترة:\n" + (byId("customers", cf.cust)?.name || "؟") + "\nمن " + cf.from + " إلى " + cf.to); return false; }
      
      const car = byId("cars", v("b"));
      const tripDays = days(v("c"), v("d"));
      let baseTotal = +v("e");
      if (!baseTotal) {
        if (tripDays >= 30 && car?.monthPrice) {
          baseTotal = Math.round((tripDays / 30) * car.monthPrice);
        } else {
          baseTotal = tripDays * (car?.price || 0);
        }
      }

      save("bookings", {
        id: b.id,
        cust: v("a"),
        car: v("b"),
        from: v("c"),
        to: v("d"),
        total: baseTotal,
        dailyKm: +v("dailyKm") || 200,
        extraKmPrice: +v("extraKmPrice") || 0,
        status: b.status || "open",
        odoOut: +v("k") || 0,
        odoIn: +v("m") || 0,
        ...(b.id ? { pays: pays(b), paid: paidOf(b) } : { pays: +v("f") ? [{ d: v("c") < today() ? v("c") : today(), a: +v("f"), w: v("w") }] : [], paid: +v("f") || 0 })
      });

      // Update car odometer if return odometer was entered
      if (+v("m") && car) {
        save("cars", { ...car, odo: Math.max(car.odo || 0, +v("m")) });
      }
    }, b.id && (() => del("bookings", b.id)));

  setTimeout(() => {
    const carSel = document.getElementById("b");
    const odoOutInp = document.getElementById("k");
    if (carSel && odoOutInp && !b.id && !odoOutInp.value) {
      const updateOdo = () => {
        const cNow = byId("cars", carSel.value);
        if (cNow) odoOutInp.value = curKm(cNow) || "";
      };
      updateOdo();
      carSel.onchange = updateOdo;
    }
  }, 60);
}

function pay(id) {

  open("استلام دفعة نقدية",
    inp("a", "المبلغ (ج.م)", "", "number") +

    () => {

      const x = +v("a");
      if (!x) return false;
      setPays(b, [...pays(b), { d: v("d") || today(), a: x, w: v("w") }]);
    });
}

function fPay(id, i) {
  const b = byId("bookings", id), a = pays(b), x = a[i];
  open("تعديل دفعة",
    inp("a", "المبلغ", x.a, "number") +
    inp("d", "تاريخ الدفع", x.d, "date") +
    recSel(x.w),
    () => {
      if (!req(["a", "d"]) || !+v("a")) return false;
      a[i] = { d: v("d") || x.d, a: +v("a"), w: v("w") };
      setPays(b, a);
    }, () => ask("متأكد من حذف الدفعة؟").then(ok => ok && setPays(b, a.filter((_, k) => k !== i))));
}

function done(id) {
  const b = byId("bookings", id);
  if (b.status === "done") return save("bookings", { ...b, status: "open" });
  open("تسليم العربية وإنهاء الحجز",
    inp("m", "عداد الدخول (كم) — لحساب الكيلومتر المقطوع والزيادة", b.odoIn || "", "number"),
    () => {
      if (!req(["m"])) return false;
      const m = +v("m");
      if (b.odoOut && m < b.odoOut) { alert("عداد الدخول أقل من عداد الخروج"); return false; }
      save("bookings", { ...b, status: "done", odoIn: m || b.odoIn || 0 }).then(() => {
        const car = byId("cars", b.car);
        if (car && m) {
          save("cars", { ...car, odo: Math.max(car.odo || 0, m) });
        }
        setTimeout(() => chkM(b.car, m), 400);
      });
    });
}

async function boot() {
  getUsersList(); // Ensure admin exists

  const savedUserJson = SafeStorage.get("autodrive_cur_user");
  if (savedUserJson) {
    try { CURRENT_USER = JSON.parse(savedUserJson); }
    catch(e) { CURRENT_USER = null; }
  }

  // If no saved user, default to admin for seamless first open
  if (!CURRENT_USER) {
    const list = getUsersList();
    CURRENT_USER = list[0];
    SafeStorage.set("autodrive_cur_user", JSON.stringify(CURRENT_USER));
  }

  try { db = await claude.use("db"); } catch (e) { db = null; }
  try { A = await claude.use("assets"); } catch (e) {}
  try { DL = await claude.use("downloads"); } catch (e) {}

  if (!db) {
    db = { collection: k => LocalDB.collection(k) };
  }

  for (const k of Object.keys(D)) {
    db.collection(k).onSnapshot(s => {
      D[k] = s.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    });
  }

  // Handle incoming real-time cloud data from Firestore
  window.onCloudSync = function(col, jsonArrayStr) {
    try {
      const cloudItems = JSON.parse(jsonArrayStr);
      if (cloudItems && Array.isArray(cloudItems)) {
        LocalDB.set(col, cloudItems);
        D[col] = cloudItems;
        if (col === "users" && CURRENT_USER) {
          const fresh = cloudItems.find(u => u.id === CURRENT_USER.id);
          if (fresh) {
            CURRENT_USER = fresh;
            SafeStorage.set("autodrive_cur_user", JSON.stringify(fresh));
          }
        }
        if (typeof render === "function") {
          render();
        }
      }
    } catch(e) {
      console.error("Cloud sync parse error", e);
    }
  };

  // Start real-time Firestore listeners across all devices
  if (window.AndroidBridge && window.AndroidBridge.startCloudListeners) {
    try { window.AndroidBridge.startCloudListeners(); } catch(e) {}
  }

  $("#fab").onclick = () => {
    if (tab === "users") return fUser();
    if (tab === "fines") return fFine();
    ({
      cars: fCar, cust: fCust, book: fBook, fines: fFine,
      acc: fTx, maint: fMaint, hold: fHold, owners: fOwner
    })[tab]();
  };

  render();
}

boot();
